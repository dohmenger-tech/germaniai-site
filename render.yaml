services:
  - type: web
    name: germaniai-api
    runtime: node
    plan: free
    rootDir: api
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SUPABASE_URL
        value: https://ifycgqyzolsesddoofrk.supabase.co
      - key: SUPABASE_ANON
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: FIRMA_SECRETA
        generateValue: true
      - key: GMAIL_USUARIO
        value: dohmenger@gmail.com
      - key: GMAIL_CLAVE_APP
        sync: false
      - key: MAX_POR_HORA
        value: "15"
      - key: MAX_POR_DIA
        value: "300"
